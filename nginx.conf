server {
    listen 80;
    server_name cms.diagnostikilemesou.com;
    root /var/www/html/cms_agapiou/public;
    index index.php index.html;

    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # Adjust PHP version as needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Increase timeouts for long-running requests
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to Laravel sensitive directories and files
    location ~ ^/(storage|vendor|database|bootstrap/cache|tests|config|routes|\.env) {
        deny all;
        return 404;
    }

    # Allow access to storage/app/public (if using symbolic link)
    location ^~ /storage {
        alias /var/www/html/cms_agapiou/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # Client upload limits
    client_max_body_size 100M;

    # Disable access log for favicon and robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Log files
    access_log /var/log/nginx/cms-agapiou-access.log;
    error_log  /var/log/nginx/cms-agapiou-error.log error;
}

# HTTPS server (uncomment after setting up SSL with Certbot)
server {
    listen 443 ssl http2;
    server_name cms.diagnostikilemesou.com;
    root /var/www/html/cms_agapiou/public;
    index index.php index.html;

    charset utf-8;

    # SSL certificate configuration
    ssl_certificate /etc/ssl/certs/self-signed.crt;
    ssl_certificate_key /etc/ssl/private/self-signed.key;
    
    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip compression
    gzip on;
    gzip_vary on;
